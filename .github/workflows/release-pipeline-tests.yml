name: Release pipeline checks

on:
  push:
    branches:
      - feature/github-runtime-acceptance
      - feature/github-code-rollback
      - feature/github-install-preview
      - feature/github-deployment-manager
      - feature/github-release-pipeline
      - feature/github-preview-releases
    paths:
      - "src/apps_script/**"
      - "tools/build_release_manifest.js"
      - "tools/test_release_manifest.js"
      - "tools/run_github_deployment_manager_tests.js"
      - "tools/validate_release_tag.sh"
      - "tools/test_release_tag_policy.sh"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-pipeline-tests.yml"
      - "docs/GITHUB_RUNTIME_ACCEPTANCE.md"
      - "docs/ROADMAP_AND_STATUS.md"
  pull_request:
    branches:
      - feature/github-runtime-acceptance
      - feature/github-deployment-manager
      - feature/github-release-pipeline

permissions:
  contents: read

# D-05 confirmed installer and D-06 verified source rollback are covered by this workflow.
# Pull-request checks are enabled by the feature/github-install-preview base workflow.

jobs:
  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate manifest builder syntax
        run: node --check tools/build_release_manifest.js && node --check tools/test_release_manifest.js
      - name: Test release manifest contract
        run: node tools/test_release_manifest.js
      - name: Test Stable and Preview Git tag policy
        run: bash -n tools/validate_release_tag.sh && bash -n tools/test_release_tag_policy.sh && bash tools/test_release_tag_policy.sh
      - name: Validate all Apps Script modules
        run: bash tools/check_syntax.sh
      - name: Installed Apps Script snapshot auditor tests
        run: node --test tools/tests/audit_apps_script_snapshot.test.js
      - name: Existing source regression suites (run independently and aggregate failures)
        shell: bash
        run: |
          failed=0
          run_suite() {
            label="$1"
            shift
            echo "::group::$label"
            if "$@"; then
              echo "PASS: $label"
            else
              result=$?
              echo "FAIL: $label (exit $result)"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_suite "FIFO replay" node tools/run_fifo_replay_tests.js
          run_suite "Order Domain" node tools/run_order_domain_tests.js
          run_suite "Supply Workspace UX" node tools/run_supply_workspace_ux_tests.js
          run_suite "Catalog/Order UX" node tools/run_catalog_order_ux_tests.js
          run_suite "System Safety UX" node tools/run_system_safety_ux_tests.js
          run_suite "Warehouse Dashboard" node tools/run_warehouse_dashboard_tests.js
          run_suite "Finance Schema" node tools/run_finance_schema_tests.js
          run_suite "GitHub Deployment Manager" node tools/run_github_deployment_manager_tests.js
          exit "$failed"
