name: Import Dots Inventory v3 RC8 source snapshot

on:
  push:
    branches: [main]
    paths:
      - "archives/rc8-source.tar.xz.b64.part-*"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify source archive
        shell: bash
        run: |
          python - <<'PY'
          import base64, glob, hashlib, pathlib, shutil, tarfile, tempfile

          expected_sha256 = "1d176f7b6396950a86ac36355575832fb58aac9afe408c4734be5f287890ed75"
          paths = sorted(glob.glob("archives/rc8-source.tar.xz.b64.part-*"))
          expected_names = [f"archives/rc8-source.tar.xz.b64.part-{i:03d}" for i in range(28)]
          if paths != expected_names:
              raise SystemExit(f"Expected exactly 12 archive parts; found: {paths}")

          encoded = "".join(pathlib.Path(path).read_text(encoding="ascii").strip() for path in paths)
          archive_bytes = base64.b64decode(encoded, validate=True)
          actual_sha = hashlib.sha256(archive_bytes).hexdigest()
          if actual_sha != expected_sha256:
              raise SystemExit(f"SHA-256 mismatch: {actual_sha}")

          with tempfile.TemporaryDirectory() as temp:
              temp_path = pathlib.Path(temp)
              archive_path = temp_path / "source.tar.xz"
              archive_path.write_bytes(archive_bytes)
              extract_path = temp_path / "extract"
              extract_path.mkdir()

              with tarfile.open(archive_path, "r:xz") as archive:
                  members = archive.getmembers()
                  for member in members:
                      member_path = pathlib.PurePosixPath(member.name)
                      if member_path.is_absolute() or ".." in member_path.parts:
                          raise SystemExit(f"Unsafe path in archive: {member.name}")
                      if not member.name.startswith("DI3_RC8_Repository/"):
                          raise SystemExit(f"Unexpected top-level archive path: {member.name}")
                      if member.issym() or member.islnk() or member.isdev():
                          raise SystemExit(f"Unsupported special file: {member.name}")
                      if member.name.endswith("/.clasp.json") or member.name == "DI3_RC8_Repository/.clasp.json":
                          raise SystemExit("Refusing to import .clasp.json")
                  archive.extractall(extract_path)

              source_root = extract_path / "DI3_RC8_Repository"
              if not source_root.is_dir():
                  raise SystemExit("Source root not found after extraction")

              # Copy the archive's exact tree into the repository root. Files in the
              # archive intentionally overwrite earlier setup placeholders/notes.
              for item in source_root.iterdir():
                  destination = pathlib.Path(".") / item.name
                  if item.is_dir():
                      shutil.copytree(item, destination, dirs_exist_ok=True)
                  else:
                      shutil.copy2(item, destination)

          print("RC8 source archive verified and extracted successfully.")
          PY

      - name: Commit imported source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf archives
          git add -A
          git commit -m "Import exact Dots Inventory v3 RC8 source snapshot (2026-11-24)"
          git push origin HEAD:main
