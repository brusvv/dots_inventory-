name: Apps Script quality gates
on:
  push:
    branches: [main]
    paths:
      - "src/apps_script/**"
      - "runtime/probes/**"
      - "tools/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, feature/clean-final-baseline]
permissions:
  contents: read
jobs:
  source-and-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check Apps Script syntax
        run: bash tools/check_syntax.sh
      - name: Release manifest contract tests
        run: node tools/test_release_manifest.js
      - name: FIFO replay and sequence tests
        run: node tools/run_fifo_replay_tests.js
      - name: Order domain tests
        run: node tools/run_order_domain_tests.js
      - name: Supply workspace UX tests
        run: node tools/run_supply_workspace_ux_tests.js
      - name: Catalog and order UX tests
        run: node tools/run_catalog_order_ux_tests.js
      - name: System safety and operation tests
        run: node tools/run_system_safety_ux_tests.js
      - name: Warehouse dashboard tests
        run: node tools/run_warehouse_dashboard_tests.js
      - name: Finance schema tests
        run: node tools/run_finance_schema_tests.js
      - name: GitHub deployment manager tests
        run: node tools/run_github_deployment_manager_tests.js
